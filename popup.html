<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" />
  <style>
    :root {
      --paper: #f5f2ec;
      --paper-2: #fff;
      --ink: #16150f;
      --ink-soft: #5d5a4f;
      --line: #dedacf;
      --accent: #ff6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121110;
        --paper-2: #1b1a18;
        --ink: #ece8df;
        --ink-soft: #9a958a;
        --line: #2d2b27;
      }
    }
    body {
      width: 232px;
      margin: 0;
      padding: 14px;
      display: grid;
      gap: 8px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.4 Geist, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      font-weight: 500;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper-2);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.12s, transform 0.12s, opacity 0.12s;
    }
    button:hover { border-color: var(--ink-soft); }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    button.primary:hover { opacity: 0.88; }
    #bg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    #bg button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px 5px 6px;
      border-radius: 99px;
      font-size: 12px;
      color: var(--ink-soft);
    }
    #bg button::before {
      content: '';
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--swatch);
    }
    #bg button[aria-pressed='true'] { border-color: var(--ink); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <button class="primary" data-full="false">Full screen</button>
  <button data-full="true">Full page</button>
  <div id="bg" role="group" aria-label="Backgrounds">
    <button data-bg="sunset" style="--swatch: linear-gradient(135deg, #ff6b6b, #ffa94d)">Sunset</button>
    <button data-bg="ocean" style="--swatch: linear-gradient(135deg, #1c7ed6, #22b8cf)">Ocean</button>
    <button data-bg="aurora" style="--swatch: linear-gradient(135deg, #2f9e44, #7048e8)">Aurora</button>
    <button data-bg="grape" style="--swatch: linear-gradient(135deg, #9c36b5, #e64980)">Grape</button>
    <button data-bg="mint" style="--swatch: linear-gradient(135deg, #63e6be, #74c0fc)">Mint</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
