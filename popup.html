<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" />
  <style>
    :root {
      --paper: #f5f2ec;
      --paper-2: #fff;
      --ink: #16150f;
      --ink-soft: #5d5a4f;
      --line: #dedacf;
      --accent: #ff6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121110;
        --paper-2: #1b1a18;
        --ink: #ece8df;
        --ink-soft: #9a958a;
        --line: #2d2b27;
      }
    }
    body {
      width: 268px;
      margin: 0;
      padding: 14px;
      display: grid;
      gap: 8px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.4 Geist, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      font-weight: 500;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper-2);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.12s, transform 0.12s, opacity 0.12s;
    }
    button:hover { border-color: var(--ink-soft); }
    button:active { transform: translateY(1px); }
    .row { display: flex; justify-content: space-between; margin: 6px 0 -4px; }
    .row button { padding: 2px 4px; border: 0; background: none; font-size: 12px; color: var(--ink-soft); }
    .row button:hover { color: var(--ink); }
    #bg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tile { position: relative; display: grid; }
    #bg [data-bg] {
      position: relative;
      display: grid; gap: 5px; padding: 5px 5px 6px; font-size: 12px; color: var(--ink-soft);
      white-space: nowrap;
      transition: border-color 0.12s, transform 0.12s, opacity 0.2s, filter 0.2s;
    }
    #bg [data-bg]::before {
      content: '';
      height: 44px;
      border-radius: 6px;
      background: var(--wall) center / cover;
    }
    .pin {
      position: absolute; top: 9px; left: 9px;
      width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--paper); color: var(--ink);
      opacity: 0;
    }
    .tile:hover .pin { opacity: 0.5; }
    .tile:has([data-bg]:active) .pin { transform: translateY(1px); }
    .tile .pin:hover, .tile .pin:focus-visible, .tile .pin[aria-pressed='true'] { opacity: 1; }
    .pin[aria-pressed='true'] svg { fill: currentColor; }
    #bg [data-bg][aria-pressed='true'] { color: var(--ink); }
    #bg [data-bg][aria-pressed='false'] { opacity: 0.4; filter: grayscale(1); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <button data-full="false">Current screen</button>
  <button data-full="true">Entire page</button>
  <div class="row">
    <button id="refresh">Refresh</button>
    <button id="all"></button>
  </div>
  <div id="bg" role="group" aria-label="Backgrounds"></div>
  <template id="tile">
    <div class="tile">
      <button data-bg></button>
      <button class="pin">
        <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
    </div>
  </template>
  <script src="popup.js"></script>
</body>
</html>
