<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" />
  <style>
    :root {
      --paper: #f5f2ec;
      --paper-2: #fff;
      --ink: #16150f;
      --ink-soft: #5d5a4f;
      --line: #dedacf;
      --accent: #ff6b6b;
      --small: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121110;
        --paper-2: #1b1a18;
        --ink: #ece8df;
        --ink-soft: #9a958a;
        --line: #2d2b27;
      }
    }
    body {
      width: 268px;
      margin: 0;
      padding: 14px;
      display: grid;
      gap: 8px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.4 Geist, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      font-weight: 500;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper-2);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.12s, transform 0.12s, opacity 0.12s;
    }
    button:hover { border-color: var(--ink-soft); }
    button:active { transform: translateY(1px); }
    [hidden] { display: none !important; }
    [data-full] { display: flex; flex-direction: row-reverse; align-items: center; justify-content: space-between; gap: 8px; }
    [data-full] svg { color: var(--ink-soft); }
    section { display: grid; gap: 8px; }
    .setting {
      display: grid; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--paper-2); overflow: hidden;
    }
    .setting > label, #open {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-weight: 500;
    }
    .setting > label { justify-content: space-between; cursor: pointer; }
    #open { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; text-align: left; }
    #open:hover { background: var(--paper); }
    #open span:not(.thumb) { display: grid; flex: 1; }
    small { font-size: var(--small); font-weight: 400; color: var(--ink-soft); }
    .chev { color: var(--ink-soft); }
    [role='switch'] {
      appearance: none; flex: none; margin: 0; width: 30px; height: 18px; border-radius: 9px;
      background: var(--line); cursor: pointer; transition: background 0.15s;
    }
    [role='switch']::before {
      content: ''; display: block; width: 14px; height: 14px; margin: 2px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: transform 0.15s;
    }
    [role='switch']:checked { background: var(--accent); }
    [role='switch']:checked::before { transform: translateX(12px); }
    header { display: flex; align-items: center; gap: 4px; margin: -4px 0 2px -6px; }
    header button { padding: 4px 8px; border: 0; background: none; color: var(--ink-soft); }
    header button:hover { color: var(--ink); }
    #back { display: grid; padding: 4px 6px; }
    #toggle-all { margin-left: auto; margin-right: -8px; font-size: var(--small); }
    .thumb { flex: none; width: 36px; height: 26px; border-radius: 5px; background: var(--wall); }
    .setting:has([role='switch']:not(:checked)) #open { opacity: 0.45; filter: grayscale(1); }
    #bg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #bg label {
      position: relative; display: grid; gap: 5px; padding: 5px 5px 6px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--paper-2);
      font-size: var(--small); font-weight: 500; color: var(--ink-soft); text-align: center; white-space: nowrap;
      cursor: pointer; transition: border-color 0.12s;
    }
    #bg label::before { content: ''; height: 44px; border-radius: 6px; background: var(--wall); }
    #bg label:hover { border-color: var(--ink-soft); }
    #bg label:has(:checked) { border-color: var(--accent); color: var(--ink); }
    #bg label:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    #bg input { position: absolute; opacity: 0; pointer-events: none; }
    #bg .check {
      position: absolute; top: 9px; right: 9px; padding: 2px; border-radius: 50%;
      background: var(--accent); color: #fff; opacity: 0; scale: 0.6; transition: opacity 0.15s, scale 0.15s;
    }
    #bg label:has(:checked) .check { opacity: 1; scale: 1; }
    #bg .shuffle {
      position: absolute; top: 14px; left: 50%; translate: -50%; padding: 5px; border-radius: 50%;
      background: rgb(0 0 0 / 0.45); color: #fff; backdrop-filter: blur(4px); transition: background 0.15s;
    }
    #bg label:has(:checked) .shuffle { background: var(--accent); }
    #bg.all label:has(:checked):not(:first-child) { filter: saturate(0.5) opacity(0.55); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <section id="main">
    <button data-full="false">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
      Current screen
    </button>
    <button data-full="true">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2"/></svg>
      Entire page
    </button>
    <div class="setting">
      <label>
        Background image
        <input type="checkbox" role="switch" id="bg-on" />
      </label>
      <button id="open">
        <span class="thumb"></span>
        <span>Customize <small id="pick"></small></span>
        <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </section>
  <section id="custom" hidden>
    <header>
      <button id="back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <button id="toggle-all"></button>
    </header>
    <div id="bg" role="group" aria-label="Background images to shuffle between"></div>
  </section>
  <template id="tile">
    <label>
      <input type="checkbox" />
      <svg class="shuffle" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
      <svg class="check" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <span></span>
    </label>
  </template>
  <script src="popup.js"></script>
</body>
</html>
