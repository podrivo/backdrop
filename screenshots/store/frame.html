<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&display=swap" />
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 800px;
      background: #f5f2ec;
      overflow: hidden;
    }
    .panel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      padding: 24px;
      display: grid;
      gap: 14px;
      background: #f5f2ec;
      color: #16150f;
      font: 500 20px/1.35 Geist, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      border-radius: 20px;
    }
    .panel > button {
      font: inherit;
      font-weight: 500;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1.5px solid #dedacf;
      background: #fff;
      color: #16150f;
      text-align: center;
    }
    #bg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    #bg button {
      display: grid;
      gap: 8px;
      padding: 8px;
      font: 500 16px/1.3 Geist, ui-sans-serif, system-ui, sans-serif;
      color: #5d5a4f;
      white-space: nowrap;
      border-radius: 14px;
      border: 1.5px solid #dedacf;
      background: #fff;
      text-align: center;
    }
    #bg button img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    #bg button[aria-pressed='true'] {
      border-color: #16150f;
      color: #16150f;
    }
  </style>
</head>
<body>
  <div class="panel">
    <button type="button">Full screen</button>
    <button type="button">Full page</button>
    <div id="bg">
      <button type="button" aria-pressed="true"><img src="thumbs/forest-road.jpg" alt="" />Forest Road</button>
      <button type="button"><img src="thumbs/red-peaks.jpg" alt="" />Red Peaks</button>
      <button type="button"><img src="thumbs/dunes.jpg" alt="" />Dunes</button>
      <button type="button"><img src="thumbs/canyon.jpg" alt="" />Canyon</button>
      <button type="button"><img src="thumbs/meadow.jpg" alt="" />Meadow</button>
      <button type="button"><img src="thumbs/autumn-peaks.jpg" alt="" />Autumn</button>
      <button type="button"><img src="thumbs/fittonia.jpg" alt="" />Fittonia</button>
      <button type="button"><img src="thumbs/tower.jpg" alt="" />Tower</button>
      <button type="button"><img src="thumbs/fog.jpg" alt="" />Fog</button>
    </div>
  </div>
</body>
</html>
